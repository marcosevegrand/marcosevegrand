baseURL: "https://marcosev.com/"
locale: "en"
title: "Marco Sèvegrand"
enableRobotsTXT: true
enableGitInfo: true
timeZone: "Europe/Lisbon"

# The Astro migration keeps shared sources under ./src (src/data, src/styles).
# Hugo's mounts are per-component replacements, so re-add the defaults we still
# use and point data/assets at their new homes. This keeps `hugo` runnable on
# the migration branch so its output can be compared against Astro's.
module:
  mounts:
    - { source: "content", target: "content" }
    - { source: "layouts", target: "layouts" }
    - { source: "archetypes", target: "archetypes" }
    - { source: "static", target: "static" }
    - { source: "assets", target: "assets" }
    - { source: "src/styles", target: "assets/css" }
    - { source: "src/data", target: "data" }

outputs:
  home:
    - HTML
    - RSS
    - JSON

permalinks:
  posts: "/posts/:slug/"

taxonomies:
  tag: "tags"

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    noClasses: false

params:
  description: "Personal website of Marco Sèvegrand, a software engineer focused on cybersecurity, infrastructure, networks and systems architecture."
  author: "Marco Sèvegrand"
  role: "Software Engineer"
  location: "Braga, Portugal"
  dateFormat: "02-01-2006"
  resume: "/cv/resume.pdf"
  ogImage: "/og-image.svg"
  contacts:
    - label: "contact@marcosev.com"
      href: "mailto:contact@marcosev.com"
  socials:
    - label: "GitHub"
      href: "https://github.com/marcosevegrand"
    - label: "LinkedIn"
      href: "https://linkedin.com/in/marcosevegrand"
    - label: "HackTheBox"
      href: "https://profile.hackthebox.com/profile/019ed207-d16a-73ea-b364-93cb385a2cf5"
    - label: "TryHackMe"
      href: "https://tryhackme.com/p/marcosevegrand"
    - label: "Credly"
      href: "https://www.credly.com/users/marcosevegrand"

menus:
  main:
    - name: "Posts"
      pageRef: "/posts"
      weight: 10
    - name: "About"
      pageRef: "/about"
      weight: 20
    - name: "Resume"
      url: "/cv/resume.pdf"
